name: Build GPON-A (vendor driver)

# Route A: OpenWrt/LEDE an7581 image for Nokia XG-040G-MD with the
# Airoha vendor xPON (xpon-en757x v2) kernel modules built in.
# This is a feasibility image for a GPON line, not PonWrt.

on:
  workflow_dispatch:
    inputs:
      device:
        description: Device
        required: true
        default: nokia_xg-040g-md-ubi
        type: choice
        options:
          - nokia_xg-040g-md-ubi
          - nokia_xg-040g-md

permissions:
  contents: read

concurrency:
  group: build-gpon-a
  cancel-in-progress: false

jobs:
  build:
    name: Build GPON-A ${{ inputs.device }}
    runs-on: ubuntu-24.04
    timeout-minutes: 350

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: gpon-a

      - name: Free build space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo apt-get clean
          df -h /

      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            asciidoc autoconf automake autopoint binutils bison build-essential \
            bzip2 ccache clang cmake cpio curl device-tree-compiler flex gawk \
            gettext git g++-multilib gcc-multilib gperf help2man intltool \
            libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev \
            libmpfr-dev libncurses-dev libpython3-dev libreadline-dev libssl-dev \
            libtool libyaml-dev lld llvm ninja-build p7zip-full patch pkgconf \
            python3 python3-docutils python3-pip python3-ply python3-pyelftools \
            qemu-utils re2c rsync scons squashfs-tools subversion swig texinfo \
            uglifyjs unzip wget xmlto xxd zlib1g-dev zstd

      - name: Configure GPON-A
        run: |
          mkdir -p staging_dir/host
          touch staging_dir/host/.prereq-build
          cat > .config <<'EOF'
          CONFIG_TARGET_airoha=y
          CONFIG_TARGET_airoha_an7581=y
          CONFIG_TARGET_DEVICE_airoha_an7581_DEVICE_nokia_xg-040g-md-ubi=y
          CONFIG_TARGET_airoha_an7581_DEVICE_nokia_xg-040g-md-ubi=y
          CONFIG_TARGET_DEVICE_airoha_an7581_DEVICE_nokia_xg-040g-md=y
          CONFIG_TARGET_airoha_an7581_DEVICE_nokia_xg-040g-md=y
          CONFIG_PACKAGE_kmod-airoha-xpon-en757x=y
          CONFIG_PACKAGE_kmod-airoha-gpon-en757x is not set
          CONFIG_PACKAGE_kmod-i2c-core=y
          CONFIG_PACKAGE_kmod-usb3=y
          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-base=y
          CONFIG_PACKAGE_dropbear=y
          CONFIG_PACKAGE_uboot-envtools=y
          EOF
          FORCE=1 make defconfig
          grep -E 'TARGET_DEVICE_airoha_an7581|airoha.*(xpon|gpon)|kmod-i2c-core' .config || true

      - name: Build host tools
        run: |
          mkdir -p staging_dir/host
          touch staging_dir/host/.prereq-build
          make -j"$(nproc)" tools/install

      - name: Point feeds at GitHub mirrors
        run: |
          cat > feeds.conf.default <<'EOF'
          src-git packages https://github.com/coolsnowwolf/packages.git
          src-git luci https://github.com/coolsnowwolf/luci.git
          src-git routing https://github.com/coolsnowwolf/routing.git
          src-git telephony https://github.com/coolsnowwolf/telephony.git
          EOF

      - name: Install feeds
        run: |
          retry() {
            for i in 1 2 3; do
              "$@" && return 0
              echo "attempt $i failed: $*" >&2
              sleep 15
            done
            return 1
          }
          retry ./scripts/feeds update -a
          retry ./scripts/feeds install -a

      - name: Refresh config after feeds
        run: |
          cat > .config <<'EOF'
          CONFIG_TARGET_airoha=y
          CONFIG_TARGET_airoha_an7581=y
          CONFIG_TARGET_DEVICE_airoha_an7581_DEVICE_nokia_xg-040g-md-ubi=y
          CONFIG_TARGET_airoha_an7581_DEVICE_nokia_xg-040g-md-ubi=y
          CONFIG_PACKAGE_kmod-airoha-xpon-en757x=y
          CONFIG_PACKAGE_kmod-i2c-core=y
          CONFIG_PACKAGE_dropbear=y
          CONFIG_PACKAGE_uboot-envtools=y
          EOF
          FORCE=1 make defconfig
          grep -E 'TARGET_DEVICE_airoha_an7581|airoha.*(xpon|gpon)' .config || true

      - name: Verify GPON-A config
        run: |
          grep -q '^CONFIG_PACKAGE_kmod-airoha-xpon-en757x=y' .config
          grep -q '^CONFIG_TARGET_DEVICE_airoha_an7581_DEVICE_nokia_xg-040g-md-ubi=y' .config

      - name: Download sources
        continue-on-error: true
        run: |
          make download -j"$(nproc)" || make download -j1 V=s

      - name: Build
        run: |
          set -o pipefail
          make -j"$(nproc)" 2>&1 | tee build.log

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gpon-a-build-log
          path: build.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Pack images
        run: |
          mkdir -p release
          tar --zstd -cf "release/lede-gpon-a-${{ inputs.device }}.tar.zst" \
            -C bin/targets/airoha an7581

      - name: Upload images
        uses: actions/upload-artifact@v4
        with:
          name: lede-gpon-a-${{ inputs.device }}
          path: release/*.tar.zst
          if-no-files-found: error
          retention-days: 7

      - name: Summary
        if: always()
        run: |
          {
            echo "### GPON-A ${{ inputs.device }}"
            echo ""
            echo "| item | value |"
            echo "| --- | --- |"
            echo "| base | coolsnowwolf/lede (OpenWrt/LEDE) |"
            echo "| driver | kmod-airoha-xpon-en757x (vendor v2) |"
            echo "| images | \`lede-gpon-a-${{ inputs.device }}\` |"
            echo ""
            echo '```'
            ls -lh bin/targets/airoha/an7581 2>/dev/null | \
              grep -E '\.(bin|itb|img|tar)$' || echo "no images"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
